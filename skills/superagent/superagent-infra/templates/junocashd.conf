# junocashd mainnet configuration
# Place at: /root/.junocash/junocashd.conf  (chmod 600)
# Generated by: superagent-infra/scripts/install_junocashd_remote.py
#
# Mining is DISABLED in this default config. Enable gen/genproclimit AFTER
# full sync completes (getblocktemplate unavailable while syncing).

# === RPC (loopback only) ===
rpcuser=junorpc
rpcpassword=CHANGE_ME_TO_LONG_RANDOM_STRING
rpcallowip=127.0.0.1
rpcport=8232

# === Network ===
listen=1
server=1
port=8234

# === Daemonize ===
daemon=1

# === Indexing ===
txindex=1
dbcache=512
maxorphantx=100

# === Mining (ENABLE AFTER SYNC) ===
# gen=1
# genproclimit=12
# miningaddr=<t_address_from_t_getminingaddress>

# === Seed nodes (Juno Cash network is small — hardcode for faster peer discovery) ===
# Without these, sync can stall at <1 peer for hours.
addnode=dnsseed.junocash.com
addnode=seed.junocash.com
addnode=mainnet.junocash.tools

# === Wallet ===
# wallet=wallet.dat
