<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Watermark: Reel/Story overlay — top-left brand badge -->
  
  <!-- Rounded rect badge -->
  <rect x="30" y="30" width="220" height="70" rx="12" fill="#0F0F0F" opacity="0.7"/>
  <rect x="30" y="30" width="220" height="70" rx="12" fill="none" stroke="#D4A574" stroke-width="1" opacity="0.3"/>
  
  <!-- HL initials -->
  <text x="65" y="78" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#D4A574" opacity="0.9" letter-spacing="-1">HL</text>
  
  <!-- Brand name -->
  <text x="110" y="62" font-family="Georgia, serif" font-size="18" letter-spacing="4" fill="#D4A574" opacity="0.8">HAUS</text>
  <text x="110" y="82" font-family="Georgia, serif" font-size="11" letter-spacing="5" fill="#D4A574" opacity="0.55">LIVING</text>
</svg>
