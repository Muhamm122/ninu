<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E1E"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg5)"/>
  
  <!-- Geometric H made of furniture lines -->
  <g transform="translate(540, 350)" stroke="#D4A574" stroke-width="8" stroke-linecap="round" fill="none">
    <!-- H left vertical -->
    <line x1="-60" y1="-100" x2="-60" y2="100"/>
    <!-- H right vertical -->
    <line x1="60" y1="-100" x2="60" y2="100"/>
    <!-- H horizontal -->
    <line x1="-60" y1="0" x2="60" y2="0"/>
    
    <!-- Roof accent on top of H -->
    <line x1="-80" y1="-110" x2="0" y2="-140" stroke-width="4" opacity="0.6"/>
    <line x1="80" y1="-110" x2="0" y2="-140" stroke-width="4" opacity="0.6"/>
  </g>
  
  <!-- HAUS -->
  <text x="540" y="600" text-anchor="middle" font-family="Georgia, serif" font-size="120" letter-spacing="20" fill="#D4A574">HAUS</text>
  
  <!-- LIVING -->
  <text x="540" y="700" text-anchor="middle" font-family="Georgia, serif" font-size="70" letter-spacing="28" fill="#D4A574" opacity="0.8">LIVING</text>
  
  <!-- Decorative dots -->
  <g fill="#D4A574" opacity="0.3">
    <circle cx="400" cy="745" r="2"/>
    <circle cx="420" cy="745" r="2"/>
    <circle cx="440" cy="745" r="2"/>
    <circle cx="640" cy="745" r="2"/>
    <circle cx="660" cy="745" r="2"/>
    <circle cx="680" cy="745" r="2"/>
  </g>
</svg>
