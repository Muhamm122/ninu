<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F0F"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
    <linearGradient id="honey4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C89E"/>
      <stop offset="100%" style="stop-color:#D4A574"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg4)"/>
  
  <!-- IG Profile Circle (9:1 crop guide) -->
  <circle cx="540" cy="540" r="480" fill="none" stroke="#D4A574" stroke-width="0.5" opacity="0.15"/>
  
  <!-- Stacked text - wordmark style -->
  <!-- HAUS - big bold -->
  <text x="540" y="440" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="180" font-weight="bold" letter-spacing="12" fill="url(#honey4)">HAUS</text>
  
  <!-- thin divider -->
  <line x1="340" y1="475" x2="740" y2="475" stroke="#D4A574" stroke-width="1" opacity="0.5"/>
  
  <!-- LIVING - lighter, italic -->
  <text x="540" y="580" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-style="italic" letter-spacing="18" fill="#D4A574" opacity="0.75">Living</text>
  
  <!-- Small house accent between words -->
  <g transform="translate(540, 660)" opacity="0.6">
    <polygon points="0,-18 -22,0 22,0" fill="none" stroke="#D4A574" stroke-width="2"/>
    <rect x="-16" y="0" width="32" height="18" fill="none" stroke="#D4A574" stroke-width="2"/>
    <rect x="-5" y="6" width="10" height="12" fill="#D4A574" rx="1"/>
  </g>
  
  <!-- Bottom text -->
  <text x="540" y="760" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" letter-spacing="10" fill="#D4A574" opacity="0.4">HANDCRAFTED FURNITURE</text>
  
  <!-- Subtle warm glow -->
  <radialGradient id="glow" cx="50%" cy="45%" r="40%">
    <stop offset="0%" style="stop-color:#D4A574;stop-opacity:0.03"/>
    <stop offset="100%" style="stop-color:#D4A574;stop-opacity:0"/>
  </radialGradient>
  <rect width="1080" height="1080" fill="url(#glow)"/>
</svg>
