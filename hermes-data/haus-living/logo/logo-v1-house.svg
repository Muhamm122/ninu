<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2c2c2c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4A574"/>
      <stop offset="50%" style="stop-color:#E8C89E"/>
      <stop offset="100%" style="stop-color:#D4A574"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)" rx="40"/>
  
  <!-- House icon (minimalist) -->
  <g transform="translate(540, 340)">
    <!-- Roof -->
    <polygon points="0,-120 -130,0 130,0" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round"/>
    <!-- Walls -->
    <rect x="-100" y="0" width="200" height="140" fill="none" stroke="url(#gold)" stroke-width="8" rx="2"/>
    <!-- Door -->
    <rect x="-30" y="50" width="60" height="90" fill="url(#gold)" rx="3" opacity="0.9"/>
    <!-- Window left -->
    <rect x="-75" y="30" width="35" height="35" fill="none" stroke="url(#gold)" stroke-width="5" rx="2"/>
    <line x1="-57.5" y1="30" x2="-57.5" y2="65" stroke="url(#gold)" stroke-width="3"/>
    <line x1="-75" y1="47.5" x2="-40" y2="47.5" stroke="url(#gold)" stroke-width="3"/>
    <!-- Window right -->
    <rect x="40" y="30" width="35" height="35" fill="none" stroke="url(#gold)" stroke-width="5" rx="2"/>
    <line x1="57.5" y1="30" x2="57.5" y2="65" stroke="url(#gold)" stroke-width="3"/>
    <line x1="40" y1="47.5" x2="75" y2="47.5" stroke="url(#gold)" stroke-width="3"/>
  </g>
  
  <!-- Main text: HAUS -->
  <text x="540" y="600" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="120" letter-spacing="20" fill="url(#gold)">HAUS</text>
  
  <!-- Divider line -->
  <line x1="380" y1="630" x2="700" y2="630" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
  
  <!-- Sub text: LIVING -->
  <text x="540" y="700" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" letter-spacing="28" fill="#D4A574" opacity="0.85">LIVING</text>
  
  <!-- Tagline -->
  <text x="540" y="790" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" letter-spacing="6" fill="#D4A574" opacity="0.5">FURNITURE • CRAFTED • LIVING</text>
  
  <!-- Corner accents -->
  <line x1="60" y1="60" x2="160" y2="60" stroke="#D4A574" stroke-width="2" opacity="0.3"/>
  <line x1="60" y1="60" x2="60" y2="160" stroke="#D4A574" stroke-width="2" opacity="0.3"/>
  <line x1="1020" y1="60" x2="920" y2="60" stroke="#D4A574" stroke-width="2" opacity="0.3"/>
  <line x1="1020" y1="60" x2="1020" y2="160" stroke="#D4A574" stroke-width="2" opacity="0.3"/>
  <line x1="60" y1="1020" x2="160" y2="1020" stroke="#D4A574" stroke-width="2" opacity="0.3"/>
  <line x1="60" y1="1020" x2="60" y2="920" stroke="#D4A574" stroke-width="2" opacity="0.3"/>
  <line x1="1020" y1="1020" x2="920" y2="1020" stroke="#D4A574" stroke-width="2" opacity="0.3"/>
  <line x1="1020" y1="1020" x2="1020" y2="920" stroke="#D4A574" stroke-width="2" opacity="0.3"/>
</svg>
